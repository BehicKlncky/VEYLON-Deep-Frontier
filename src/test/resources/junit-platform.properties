# JUnit Platform configuration for the whole test suite.

# 0.9.1 defect B02: every @TempDir directory is created by TrackedTempDirFactory, which follows
# JUnit's standard factory, and TempDirCleanup (registered through META-INF/services) deletes it
# first after its test or class, with bounded and logged retries. JUnit's own cleanup still runs
# afterwards and still reports any directory that could not be deleted.
junit.jupiter.tempdir.factory.default=com.veylon.testsupport.TrackedTempDirFactory
junit.jupiter.extensions.autodetection.enabled=true
