plugins {
    id 'java'
    id 'application'
}

group = 'com.veylon'
version = '0.5.0'

// Headless verification (compileJava, test, check, javadoc, dependency inspection)
// needs no window, no natives and no package classifier, so platform support is
// resolved into a value instead of thrown during configuration. Only the tasks
// that genuinely consume host natives or produce a host package are gated, at
// execution time, through requireReleasePlatform below.
//
// This stays a pure function of (os.name, os.arch) so verifyPlatformContract can
// pin the whole mapping on any host rather than only the one running the build.
def resolveReleasePlatform = { String rawOsName, String rawOsArch ->
    def name = rawOsName.toLowerCase(java.util.Locale.ROOT)
    def arch = rawOsArch.toLowerCase(java.util.Locale.ROOT)
    def windows = name.contains('windows')
    def macOs = name.contains('mac')
    def arm64 = arch == 'aarch64' || arch == 'arm64'
    def x64 = arch == 'amd64' || arch == 'x86_64' || arch == 'x64'
    def supported = (windows || macOs) && (arm64 || x64)
    [
            osName               : name,
            osArch               : arch,
            macOs                : macOs,
            supported            : supported,
            platformClassifier   : !supported ? null
                    : (windows ? (arm64 ? 'windows-arm64' : 'windows-x64')
                    : (arm64 ? 'macos-arm64' : 'macos-x64')),
            nativeClassifier     : !supported ? null
                    : (windows ? (arm64 ? 'natives-windows-arm64' : 'natives-windows')
                    : (arm64 ? 'natives-macos-arm64' : 'natives-macos')),
            appImageDirectoryName: !supported ? null : (macOs ? 'Veylon.app' : 'Veylon')
    ]
}

def hostPlatform = resolveReleasePlatform(System.getProperty('os.name'), System.getProperty('os.arch'))
def isMacOs = hostPlatform.macOs
def platformClassifier = hostPlatform.platformClassifier
def nativeClassifier = hostPlatform.nativeClassifier
def appImageDirectoryName = hostPlatform.appImageDirectoryName
// Task descriptions are printed by `gradlew tasks` on every host, including the
// ones that have no classifier to name.
def platformLabel = platformClassifier ?: "${hostPlatform.osName}/${hostPlatform.osArch} (unsupported)"

def unsupportedPlatformMessage = "Unsupported release platform: ${hostPlatform.osName} / ${hostPlatform.osArch}. " +
        'VEYLON packages and runs on Windows or macOS with an x64 or arm64 JVM only, so no LWJGL native or ' +
        'app-image classifier is defined for this host. Headless verification is supported on every platform: ' +
        'run compileJava, test, check, javadoc or dependencies instead.'

// Every task that consumes the host natives or produces a host package. The list
// is asserted by verifyPlatformContract, so a future packaging task cannot quietly
// skip the gate.
def releasePlatformTaskNames = ['run', 'installDist', 'distZip', 'distTar', 'assembleDist',
                                'fatJar', 'cleanJpackage', 'jpackage', 'appImageZip', 'releaseArtifacts']

def releaseVersionParts = project.version.toString().split(/\./).toList()
if (releaseVersionParts.size() < 1 || releaseVersionParts.size() > 3 ||
        !releaseVersionParts.every { it ==~ /\d+/ }) {
    throw new GradleException("Release version must contain one to three numeric components: ${project.version}")
}
// jpackage requires the first macOS bundle-version component to be positive.
// Offset the SemVer major for the internal CFBundleVersion, then restore the
// public project version in CFBundleShortVersionString after packaging.
def macBundleVersion = releaseVersionParts.withIndex().collect { part, index ->
    Integer.parseInt(part) + (index == 0 ? 1 : 0)
}.join('.')
def jpackageAppVersion = isMacOs ? macBundleVersion : project.version.toString()

def launcherJvmArgs = ['-Xmx2G', '--enable-native-access=ALL-UNNAMED']
if (isMacOs) {
    launcherJvmArgs.add('-XstartOnFirstThread')
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

ext {
    lwjglVersion = '3.3.6'
    lwjglNatives = nativeClassifier
    jomlVersion = '1.10.8'
}

dependencies {
    implementation platform("org.lwjgl:lwjgl-bom:${lwjglVersion}")
    implementation 'org.lwjgl:lwjgl'
    implementation 'org.lwjgl:lwjgl-glfw'
    implementation 'org.lwjgl:lwjgl-opengl'
    implementation 'org.lwjgl:lwjgl-openal'
    implementation 'org.lwjgl:lwjgl-stb'
    // Natives exist only for a host VEYLON ships. Substituting a classifier here
    // would let an unsupported platform resolve and package the wrong binaries,
    // so an unsupported host simply gets no natives and a headless-only build.
    if (lwjglNatives != null) {
        runtimeOnly "org.lwjgl:lwjgl::${lwjglNatives}"
        runtimeOnly "org.lwjgl:lwjgl-glfw::${lwjglNatives}"
        runtimeOnly "org.lwjgl:lwjgl-opengl::${lwjglNatives}"
        runtimeOnly "org.lwjgl:lwjgl-openal::${lwjglNatives}"
        runtimeOnly "org.lwjgl:lwjgl-stb::${lwjglNatives}"
    }
    implementation "org.joml:joml:${jomlVersion}"
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.11.4'
}

application {
    mainClass = 'com.veylon.Main'
    applicationDefaultJvmArgs = launcherJvmArgs
}

tasks.named('wrapper', Wrapper) {
    gradleVersion = '9.1.0'
    distributionType = Wrapper.DistributionType.BIN
    distributionSha256Sum = 'a17ddd85a26b6a7f5ddb71ff8b05fc5104c0202c6e64782429790c933686c806'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.withType(Javadoc).configureEach {
    options.encoding = 'UTF-8'
    options.charSet = 'UTF-8'
    options.docEncoding = 'UTF-8'
    // Internal game APIs are not a published library surface. Keep doclint's
    // structural/HTML/link checks strict without turning missing prose on every
    // public member into a hundred-line warning stream.
    options.addBooleanOption('Xdoclint:all,-missing', true)
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    systemProperty 'veylon.version', project.version.toString()
}

// Wall-clock budgets are calibrated for one reference machine and therefore
// are opt-in rather than part of the portable deterministic suite.
tasks.named('test', Test) {
    useJUnitPlatform {
        excludeTags 'performance'
    }
}

// The classifier mapping decides which natives ship, and the release-platform
// gate is the only thing keeping an unsupported host from producing a package
// with no natives at all. Both are cheap to get wrong and invisible until a
// release, so pin the entire mapping - supported and unsupported - instead of
// only whichever host happens to run the build.
tasks.register('verifyPlatformContract') {
    group = 'verification'
    description = 'Verifies platform classifier resolution and the release-platform gate wiring.'
    def expectedSupported = [
            ['Windows 11', 'amd64', 'windows-x64', 'natives-windows', 'Veylon'],
            ['Windows 10', 'x86_64', 'windows-x64', 'natives-windows', 'Veylon'],
            ['Windows 11', 'aarch64', 'windows-arm64', 'natives-windows-arm64', 'Veylon'],
            ['Windows Server 2025', 'arm64', 'windows-arm64', 'natives-windows-arm64', 'Veylon'],
            ['Mac OS X', 'x86_64', 'macos-x64', 'natives-macos', 'Veylon.app'],
            ['Mac OS X', 'aarch64', 'macos-arm64', 'natives-macos-arm64', 'Veylon.app']
    ]
    def expectedUnsupported = [
            ['Linux', 'amd64'], ['Linux', 'aarch64'], ['Linux', 'x86_64'],
            ['FreeBSD', 'amd64'], ['SunOS', 'sparcv9'],
            ['Windows 10', 'x86'], ['Windows 11', 'riscv64'], ['Mac OS X', 'ppc']
    ]
    def resolvedRuntimeClasspath = configurations.runtimeClasspath
    doLast {
        def failures = []

        expectedSupported.each { osName, osArch, platform, natives, appImage ->
            def resolved = resolveReleasePlatform(osName, osArch)
            if (!resolved.supported || resolved.platformClassifier != platform ||
                    resolved.nativeClassifier != natives || resolved.appImageDirectoryName != appImage) {
                failures << ("${osName} / ${osArch} must resolve to supported ${platform} / ${natives} / ${appImage}" +
                        " but resolved to supported=${resolved.supported} ${resolved.platformClassifier}" +
                        " / ${resolved.nativeClassifier} / ${resolved.appImageDirectoryName}")
            }
        }

        expectedUnsupported.each { osName, osArch ->
            def resolved = resolveReleasePlatform(osName, osArch)
            if (resolved.supported || resolved.platformClassifier != null ||
                    resolved.nativeClassifier != null || resolved.appImageDirectoryName != null) {
                failures << ("${osName} / ${osArch} must resolve to unsupported with no classifier but resolved to" +
                        " supported=${resolved.supported} ${resolved.platformClassifier}" +
                        " / ${resolved.nativeClassifier} / ${resolved.appImageDirectoryName}")
            }
        }

        // The resolved classpath is the artifact that actually ships, so check it
        // rather than trusting that the coordinates above were wired correctly.
        def nativeJars = resolvedRuntimeClasspath.files.collect { it.name }.findAll { it.contains('natives-') }
        if (hostPlatform.supported) {
            def foreign = nativeJars.findAll { !it.endsWith("-${hostPlatform.nativeClassifier}.jar") }
            if (!foreign.isEmpty()) {
                failures << "Runtime classpath carries natives for another platform: ${foreign.sort()}"
            }
            if (nativeJars.size() != 5) {
                failures << ("Expected 5 ${hostPlatform.nativeClassifier} jars on the runtime classpath," +
                        " found ${nativeJars.size()}: ${nativeJars.sort()}")
            }
        } else if (!nativeJars.isEmpty()) {
            failures << "Unsupported host must resolve no LWJGL natives but found: ${nativeJars.sort()}"
        }

        releasePlatformTaskNames.each { taskName ->
            def gated = tasks.named(taskName).get()
            def gateNames = gated.taskDependencies.getDependencies(gated).collect { it.name }
            if (!gateNames.contains('requireReleasePlatform')) {
                failures << "Task ${taskName} needs the host platform but does not depend on requireReleasePlatform"
            }
        }

        // A future packaging task that forgets the gate is the regression this
        // check exists to catch, so sweep the group instead of trusting the list
        // above to have been kept complete.
        def ungated = tasks.matching { it.group == 'distribution' }.collect { it.name } -
                'requireReleasePlatform' - releasePlatformTaskNames
        if (!ungated.isEmpty()) {
            failures << "Distribution tasks missing from the release-platform gate: ${ungated.sort()}"
        }

        if (!failures.isEmpty()) {
            throw new GradleException("Platform contract violated:\n  - " + failures.join('\n  - '))
        }
        logger.lifecycle("Platform contract verified for ${hostPlatform.osName} / ${hostPlatform.osArch}" +
                " (supported=${hostPlatform.supported}, natives=${hostPlatform.nativeClassifier ?: 'none'})")
    }
}

// Broken API documentation is a source-quality failure, so the ordinary
// verification lifecycle must exercise doclint instead of leaving javadoc as
// an optional task that release packaging never sees.
tasks.named('check') {
    dependsOn tasks.named('javadoc')
    dependsOn tasks.named('verifyPlatformContract')
}

tasks.register('performanceTest', Test) {
    group = 'verification'
    description = 'Runs the hardware-calibrated simulation and save/load benchmarks.'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    outputs.upToDateWhen { false }
    useJUnitPlatform {
        includeTags 'performance'
    }
    // The measured figures are the point of this task, so print them rather
    // than making every run pass --info to see whether a budget was close.
    testLogging {
        showStandardStreams = true
    }
    shouldRunAfter tasks.named('test')
}

jar {
    archiveBaseName = 'veylon'
    manifest {
        attributes 'Main-Class': 'com.veylon.Main',
                'Implementation-Title': 'VEYLON: Deep Frontier',
                'Implementation-Version': project.version
    }
}

// One execution-time gate for every task that needs host natives or an app-image
// classifier. Configuration stays platform-neutral so headless verification runs
// anywhere, while asking an unsupported host to run or package the game fails
// immediately and says what to do instead.
def requireReleasePlatform = tasks.register('requireReleasePlatform') {
    group = 'distribution'
    description = 'Fails unless the host has a defined LWJGL native and app-image classifier.'
    doLast {
        if (!hostPlatform.supported) {
            throw new GradleException(unsupportedPlatformMessage)
        }
    }
}

// Single runnable fat jar with all dependencies and natives included.
tasks.register('fatJar', Jar) {
    group = 'distribution'
    description = 'Builds a single runnable jar containing all dependencies.'
    archiveBaseName = 'veylon'
    archiveClassifier = 'all'
    manifest {
        attributes 'Main-Class': 'com.veylon.Main',
                'Implementation-Title': 'VEYLON: Deep Frontier',
                'Implementation-Version': project.version
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from sourceSets.main.output
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
    exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'
}

// Platform-specific executable bundle via jpackage (requires a JDK with jpackage on PATH).
tasks.register('cleanJpackage', Delete) {
    delete layout.buildDirectory.dir("jpackage/${appImageDirectoryName}")
}

tasks.register('jpackage', Exec) {
    dependsOn 'installDist', 'cleanJpackage'
    group = 'distribution'
    description = "Creates a ${platformLabel} app-image with jpackage."
    def libDir = layout.buildDirectory.dir("install/veylon/lib").get().asFile
    def outDir = layout.buildDirectory.dir("jpackage").get().asFile
    def arguments = [
            '--type', 'app-image',
            '--name', 'Veylon',
            '--app-version', jpackageAppVersion,
            '--input', libDir.absolutePath,
            '--main-jar', "veylon-${project.version}.jar",
            '--main-class', 'com.veylon.Main',
            '--dest', outDir.absolutePath
    ]
    launcherJvmArgs.each { option ->
        arguments.addAll(['--java-options', option])
    }
    doFirst {
        outDir.mkdirs()
    }
    commandLine(['jpackage'] + arguments)
}

// GitHub Releases cannot attach a directory, so archive the complete app-image.
if (isMacOs) {
    def setMacMarketingVersion = tasks.register('setMacMarketingVersion', Exec) {
        dependsOn 'jpackage'
        group = 'distribution'
        description = 'Restores the public project version in the macOS bundle metadata.'
        def infoPlist = layout.buildDirectory.file(
                "jpackage/${appImageDirectoryName}/Contents/Info.plist").get().asFile
        commandLine '/usr/libexec/PlistBuddy', '-c',
                "Set :CFBundleShortVersionString ${project.version}", infoPlist.absolutePath
    }

    tasks.register('appImageZip', Exec) {
        dependsOn setMacMarketingVersion
        group = 'distribution'
        description = "Archives the self-contained ${platformLabel} app-image."
        def appImage = layout.buildDirectory.dir("jpackage/${appImageDirectoryName}").get().asFile
        def archive = layout.buildDirectory.file(
                "distributions/veylon-${project.version}-${platformClassifier}.zip").get().asFile
        inputs.dir(appImage)
        outputs.file(archive)
        doFirst {
            archive.parentFile.mkdirs()
            project.delete(archive)
        }
        // ditto preserves the executable bits and macOS bundle metadata.
        commandLine 'ditto', '-c', '-k', '--sequesterRsrc', '--keepParent',
                appImage.absolutePath, archive.absolutePath
    }
} else {
    tasks.register('appImageZip', Zip) {
        dependsOn 'jpackage'
        group = 'distribution'
        description = "Archives the self-contained ${platformLabel} app-image."
        archiveBaseName = 'veylon'
        archiveClassifier = platformClassifier
        destinationDirectory = layout.buildDirectory.dir('distributions')
        from(layout.buildDirectory.dir("jpackage/${appImageDirectoryName}")) {
            into 'Veylon'
        }
        from('README.md') {
            into 'Veylon'
        }
        from('CHANGELOG.md') {
            into 'Veylon'
        }
        from('src/main/resources/assets/fonts/LICENSE-SourceSans3.md') {
            into 'Veylon/licenses'
        }
    }
}

tasks.register('releaseArtifacts') {
    dependsOn 'build', 'fatJar', 'appImageZip'
    group = 'distribution'
    description = 'Builds and tests every artifact intended for a release.'
}

releasePlatformTaskNames.each { taskName ->
    tasks.named(taskName).configure {
        dependsOn requireReleasePlatform
        if (!hostPlatform.supported) {
            // Belt and braces: the task must still refuse to run if the gate is
            // excluded with -x, because its output would carry no natives.
            doFirst {
                throw new GradleException(unsupportedPlatformMessage)
            }
        }
    }
}
