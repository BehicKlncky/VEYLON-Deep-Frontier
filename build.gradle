plugins {
    id 'java'
    id 'application'
}

group = 'com.veylon'
version = '0.5.5'

def osName = System.getProperty('os.name').toLowerCase(java.util.Locale.ROOT)
def osArch = System.getProperty('os.arch').toLowerCase(java.util.Locale.ROOT)
def isWindows = osName.contains('windows')
def isMacOs = osName.contains('mac')
def isArm64 = osArch == 'aarch64' || osArch == 'arm64'
def isX64 = osArch == 'amd64' || osArch == 'x86_64' || osArch == 'x64'

def releaseVersionParts = project.version.toString().split(/\./).toList()
if (releaseVersionParts.size() < 1 || releaseVersionParts.size() > 3 ||
        !releaseVersionParts.every { it ==~ /\d+/ }) {
    throw new GradleException("Release version must contain one to three numeric components: ${project.version}")
}
// jpackage requires the first macOS bundle-version component to be positive.
// Offset the SemVer major for the internal CFBundleVersion, then restore the
// public project version in CFBundleShortVersionString after packaging.
def macBundleVersion = releaseVersionParts.withIndex().collect { part, index ->
    Integer.parseInt(part) + (index == 0 ? 1 : 0)
}.join('.')
def jpackageAppVersion = isMacOs ? macBundleVersion : project.version.toString()

if ((!isWindows && !isMacOs) || (!isArm64 && !isX64)) {
    throw new GradleException("Unsupported release platform: ${osName} / ${osArch}")
}

def platformClassifier = isWindows
        ? (isArm64 ? 'windows-arm64' : 'windows-x64')
        : (isArm64 ? 'macos-arm64' : 'macos-x64')
def nativeClassifier = isWindows
        ? (isArm64 ? 'natives-windows-arm64' : 'natives-windows')
        : (isArm64 ? 'natives-macos-arm64' : 'natives-macos')
def appImageDirectoryName = isMacOs ? 'Veylon.app' : 'Veylon'
def launcherJvmArgs = ['-Xmx2G', '--enable-native-access=ALL-UNNAMED']
if (isMacOs) {
    launcherJvmArgs.add('-XstartOnFirstThread')
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

ext {
    lwjglVersion = '3.3.6'
    lwjglNatives = nativeClassifier
    jomlVersion = '1.10.8'
}

dependencies {
    implementation platform("org.lwjgl:lwjgl-bom:${lwjglVersion}")
    implementation 'org.lwjgl:lwjgl'
    implementation 'org.lwjgl:lwjgl-glfw'
    implementation 'org.lwjgl:lwjgl-opengl'
    implementation 'org.lwjgl:lwjgl-openal'
    implementation 'org.lwjgl:lwjgl-stb'
    runtimeOnly "org.lwjgl:lwjgl::${lwjglNatives}"
    runtimeOnly "org.lwjgl:lwjgl-glfw::${lwjglNatives}"
    runtimeOnly "org.lwjgl:lwjgl-opengl::${lwjglNatives}"
    runtimeOnly "org.lwjgl:lwjgl-openal::${lwjglNatives}"
    runtimeOnly "org.lwjgl:lwjgl-stb::${lwjglNatives}"
    implementation "org.joml:joml:${jomlVersion}"
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.11.4'
}

application {
    mainClass = 'com.veylon.Main'
    applicationDefaultJvmArgs = launcherJvmArgs
}

tasks.named('wrapper', Wrapper) {
    gradleVersion = '9.1.0'
    distributionType = Wrapper.DistributionType.BIN
    distributionSha256Sum = 'a17ddd85a26b6a7f5ddb71ff8b05fc5104c0202c6e64782429790c933686c806'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.withType(Javadoc).configureEach {
    options.encoding = 'UTF-8'
    options.charSet = 'UTF-8'
    options.docEncoding = 'UTF-8'
    // Internal game APIs are not a published library surface. Keep doclint's
    // structural/HTML/link checks strict without turning missing prose on every
    // public member into a hundred-line warning stream.
    options.addBooleanOption('Xdoclint:all,-missing', true)
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    systemProperty 'veylon.version', project.version.toString()
}

// Wall-clock budgets are calibrated for one reference machine and therefore
// are opt-in rather than part of the portable deterministic suite.
tasks.named('test', Test) {
    useJUnitPlatform {
        excludeTags 'performance'
    }
}

// Broken API documentation is a source-quality failure, so the ordinary
// verification lifecycle must exercise doclint instead of leaving javadoc as
// an optional task that release packaging never sees.
tasks.named('check') {
    dependsOn tasks.named('javadoc')
}

tasks.register('performanceTest', Test) {
    group = 'verification'
    description = 'Runs the hardware-calibrated simulation and save/load benchmarks.'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    outputs.upToDateWhen { false }
    useJUnitPlatform {
        includeTags 'performance'
    }
    // The measured figures are the point of this task, so print them rather
    // than making every run pass --info to see whether a budget was close.
    testLogging {
        showStandardStreams = true
    }
    shouldRunAfter tasks.named('test')
}

jar {
    archiveBaseName = 'veylon'
    manifest {
        attributes 'Main-Class': 'com.veylon.Main',
                'Implementation-Title': 'VEYLON: Deep Frontier',
                'Implementation-Version': project.version
    }
}

// Single runnable fat jar with all dependencies and natives included.
tasks.register('fatJar', Jar) {
    group = 'distribution'
    description = 'Builds a single runnable jar containing all dependencies.'
    archiveBaseName = 'veylon'
    archiveClassifier = 'all'
    manifest {
        attributes 'Main-Class': 'com.veylon.Main',
                'Implementation-Title': 'VEYLON: Deep Frontier',
                'Implementation-Version': project.version
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from sourceSets.main.output
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
    exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'
}

// Platform-specific executable bundle via jpackage (requires a JDK with jpackage on PATH).
tasks.register('cleanJpackage', Delete) {
    delete layout.buildDirectory.dir("jpackage/${appImageDirectoryName}")
}

tasks.register('jpackage', Exec) {
    dependsOn 'installDist', 'cleanJpackage'
    group = 'distribution'
    description = "Creates a ${platformClassifier} app-image with jpackage."
    def libDir = layout.buildDirectory.dir("install/veylon/lib").get().asFile
    def outDir = layout.buildDirectory.dir("jpackage").get().asFile
    def arguments = [
            '--type', 'app-image',
            '--name', 'Veylon',
            '--app-version', jpackageAppVersion,
            '--input', libDir.absolutePath,
            '--main-jar', "veylon-${project.version}.jar",
            '--main-class', 'com.veylon.Main',
            '--dest', outDir.absolutePath
    ]
    launcherJvmArgs.each { option ->
        arguments.addAll(['--java-options', option])
    }
    doFirst {
        outDir.mkdirs()
    }
    commandLine(['jpackage'] + arguments)
}

// GitHub Releases cannot attach a directory, so archive the complete app-image.
if (isMacOs) {
    def setMacMarketingVersion = tasks.register('setMacMarketingVersion', Exec) {
        dependsOn 'jpackage'
        group = 'distribution'
        description = 'Restores the public project version in the macOS bundle metadata.'
        def infoPlist = layout.buildDirectory.file(
                "jpackage/${appImageDirectoryName}/Contents/Info.plist").get().asFile
        commandLine '/usr/libexec/PlistBuddy', '-c',
                "Set :CFBundleShortVersionString ${project.version}", infoPlist.absolutePath
    }

    tasks.register('appImageZip', Exec) {
        dependsOn setMacMarketingVersion
        group = 'distribution'
        description = "Archives the self-contained ${platformClassifier} app-image."
        def appImage = layout.buildDirectory.dir("jpackage/${appImageDirectoryName}").get().asFile
        def archive = layout.buildDirectory.file(
                "distributions/veylon-${project.version}-${platformClassifier}.zip").get().asFile
        inputs.dir(appImage)
        outputs.file(archive)
        doFirst {
            archive.parentFile.mkdirs()
            project.delete(archive)
        }
        // ditto preserves the executable bits and macOS bundle metadata.
        commandLine 'ditto', '-c', '-k', '--sequesterRsrc', '--keepParent',
                appImage.absolutePath, archive.absolutePath
    }
} else {
    tasks.register('appImageZip', Zip) {
        dependsOn 'jpackage'
        group = 'distribution'
        description = "Archives the self-contained ${platformClassifier} app-image."
        archiveBaseName = 'veylon'
        archiveClassifier = platformClassifier
        destinationDirectory = layout.buildDirectory.dir('distributions')
        from(layout.buildDirectory.dir("jpackage/${appImageDirectoryName}")) {
            into 'Veylon'
        }
        from('README.md') {
            into 'Veylon'
        }
        from('CHANGELOG.md') {
            into 'Veylon'
        }
        from('src/main/resources/assets/fonts/LICENSE-SourceSans3.md') {
            into 'Veylon/licenses'
        }
    }
}

tasks.register('releaseArtifacts') {
    dependsOn 'build', 'fatJar', 'appImageZip'
    group = 'distribution'
    description = 'Builds and tests every artifact intended for a release.'
}
