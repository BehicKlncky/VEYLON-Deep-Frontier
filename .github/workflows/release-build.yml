name: Release builds

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  package:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-2025
            platform: windows-x64
            architecture: x64
          - name: macOS Apple Silicon
            os: macos-15
            platform: macos-arm64
            architecture: aarch64
          - name: macOS Intel
            os: macos-15-intel
            platform: macos-x64
            architecture: x64

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          architecture: ${{ matrix.architecture }}
          cache: gradle

      - name: Verify tag matches project version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          project_version="$(sed -n "s/^version = '\([^']*\)'/\1/p" build.gradle)"
          test "$GITHUB_REF_NAME" = "v$project_version"

      - name: Build Windows release archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\gradlew.bat clean releaseArtifacts --no-daemon --console=plain

      - name: Build macOS release archive
        if: runner.os == 'macOS'
        shell: bash
        run: ./gradlew clean releaseArtifacts --no-daemon --console=plain

      - name: Smoke test Windows app-image
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          VEYLON_SMOKE: "12"
          VEYLON_VSYNC: "0"
          VEYLON_MIN_FPS: "20"
        run: |
          $process = Start-Process -FilePath ".\build\jpackage\Veylon\Veylon.exe" -PassThru -Wait
          if ($process.ExitCode -ne 0) {
            throw "Packaged smoke test failed with exit code $($process.ExitCode)"
          }

      - name: Smoke test macOS app-image
        if: runner.os == 'macOS'
        shell: bash
        env:
          VEYLON_SMOKE: "12"
          VEYLON_VSYNC: "0"
          VEYLON_MIN_FPS: "20"
        run: ./build/jpackage/Veylon.app/Contents/MacOS/Veylon

      - name: Validate Windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = Get-ChildItem "build/distributions/veylon-*-${{ matrix.platform }}.zip" | Select-Object -First 1
          if (-not $archive) { throw "Release archive was not created" }
          $inspect = Join-Path $env:RUNNER_TEMP "veylon-release-inspect"
          Expand-Archive -LiteralPath $archive.FullName -DestinationPath $inspect
          if (-not (Test-Path (Join-Path $inspect "Veylon/Veylon.exe"))) {
            throw "Veylon.exe is missing from the release archive"
          }

      - name: Validate macOS archive
        if: runner.os == 'macOS'
        shell: bash
        run: |
          archive="$(find build/distributions -maxdepth 1 -name 'veylon-*-${{ matrix.platform }}.zip' -print -quit)"
          test -n "$archive"
          unzip -t "$archive"
          inspect="$RUNNER_TEMP/veylon-release-inspect"
          mkdir -p "$inspect"
          ditto -x -k "$archive" "$inspect"
          test -x "$inspect/Veylon.app/Contents/MacOS/Veylon"

      - name: Upload release archive
        uses: actions/upload-artifact@v7
        with:
          name: veylon-${{ matrix.platform }}
          path: build/distributions/veylon-*-${{ matrix.platform }}.zip
          if-no-files-found: error
