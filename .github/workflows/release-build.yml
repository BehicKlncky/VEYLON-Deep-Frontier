name: Release builds

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  package:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-2025
            platform: windows-x64
            architecture: x64
            native: natives-windows
          - name: macOS Apple Silicon
            os: macos-15
            platform: macos-arm64
            architecture: aarch64
            native: natives-macos-arm64
            binary_arch: arm64
          - name: macOS Intel
            os: macos-15-intel
            platform: macos-x64
            architecture: x64
            native: natives-macos
            binary_arch: x86_64

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          architecture: ${{ matrix.architecture }}
          cache: gradle

      - name: Verify tag matches project version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          project_version="$(sed -n "s/^version = '\([^']*\)'/\1/p" build.gradle)"
          test "$GITHUB_REF_NAME" = "v$project_version"

      - name: Build Windows release archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\gradlew.bat clean releaseArtifacts --no-daemon --console=plain

      - name: Build macOS release archive
        if: runner.os == 'macOS'
        shell: bash
        run: ./gradlew clean releaseArtifacts --no-daemon --console=plain

      - name: Validate Windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = Get-ChildItem "build/distributions/veylon-*-${{ matrix.platform }}.zip" | Select-Object -First 1
          if (-not $archive) { throw "Release archive was not created" }
          if ($archive.Length -lt 1MB) { throw "Release archive is unexpectedly small" }
          $inspect = Join-Path $env:RUNNER_TEMP "veylon-release-inspect"
          Expand-Archive -LiteralPath $archive.FullName -DestinationPath $inspect
          $app = Join-Path $inspect "Veylon"
          if (-not (Test-Path (Join-Path $app "Veylon.exe"))) {
            throw "Veylon.exe is missing from the release archive"
          }
          if (-not (Test-Path (Join-Path $app "runtime/release"))) {
            throw "Bundled Java runtime is missing from the release archive"
          }
          $config = Join-Path $app "app/Veylon.cfg"
          if (-not (Test-Path $config)) { throw "Veylon.cfg is missing" }
          $configText = Get-Content -Raw $config
          if ($configText -notmatch [regex]::Escape("${{ matrix.native }}.jar")) {
            throw "Expected LWJGL native classifier is missing from Veylon.cfg"
          }
          if ($configText -notmatch [regex]::Escape("--enable-native-access=ALL-UNNAMED")) {
            throw "Required native-access JVM option is missing from Veylon.cfg"
          }

      - name: Validate macOS archive
        if: runner.os == 'macOS'
        shell: bash
        run: |
          archive="$(find build/distributions -maxdepth 1 -name 'veylon-*-${{ matrix.platform }}.zip' -print -quit)"
          test -n "$archive"
          test "$(stat -f%z "$archive")" -gt 1048576
          unzip -tq "$archive"
          inspect="$RUNNER_TEMP/veylon-release-inspect"
          mkdir -p "$inspect"
          ditto -x -k "$archive" "$inspect"
          app="$inspect/Veylon.app"
          launcher="$app/Contents/MacOS/Veylon"
          config="$app/Contents/app/Veylon.cfg"
          info_plist="$app/Contents/Info.plist"
          test -x "$launcher"
          test -f "$app/Contents/runtime/Contents/Home/lib/libjli.dylib"
          test -f "$config"
          test -f "$info_plist"
          file "$launcher" | grep -Fq '${{ matrix.binary_arch }}'
          grep -Fq '${{ matrix.native }}.jar' "$config"
          grep -Fq 'java-options=-XstartOnFirstThread' "$config"
          grep -Fq 'java-options=--enable-native-access=ALL-UNNAMED' "$config"
          project_version="$(sed -n "s/^version = '\([^']*\)'/\1/p" build.gradle)"
          IFS='.' read -r major minor patch <<< "$project_version"
          bundle_version="$((major + 1))"
          test -z "${minor:-}" || bundle_version="$bundle_version.$minor"
          test -z "${patch:-}" || bundle_version="$bundle_version.$patch"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$info_plist")" = "$project_version"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$info_plist")" = "$bundle_version"

      - name: Upload release archive
        uses: actions/upload-artifact@v7
        with:
          name: veylon-${{ matrix.platform }}
          path: build/distributions/veylon-*-${{ matrix.platform }}.zip
          if-no-files-found: error
          compression-level: 0

  publish:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out release notes
        uses: actions/checkout@v6

      - name: Download validated platform archives
        uses: actions/download-artifact@v8
        with:
          pattern: veylon-*
          path: release-assets
          merge-multiple: true

      - name: Validate release asset set and create checksums
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          expected=(
            "veylon-${version}-windows-x64.zip"
            "veylon-${version}-macos-arm64.zip"
            "veylon-${version}-macos-x64.zip"
          )

          for asset in "${expected[@]}"; do
            test -s "release-assets/$asset"
          done

          actual_count="$(find release-assets -maxdepth 1 -type f -name 'veylon-*.zip' | wc -l | tr -d ' ')"
          test "$actual_count" -eq "${#expected[@]}"

          (
            cd release-assets
            sha256sum "${expected[@]}" > SHA256SUMS.txt
          )

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            release-assets/*.zip \
            release-assets/SHA256SUMS.txt \
            --verify-tag \
            --title "VEYLON: Deep Frontier ${GITHUB_REF_NAME#v}" \
            --notes-file "docs/releases/${GITHUB_REF_NAME}.md" \
            --latest
