name: Verify

# The portable build (compile, the headless test suite, Javadoc/doclint) on every push and pull
# request. Release packaging stays in release-build.yml.
on:
  push:
    branches:
      - "**"
      # Recovery branches already run the full release build.
      - "!release-recovery/**"
  pull_request:
  schedule:
    # Weekly macOS run (Mondays 04:00 UTC); see the macOS job.
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# A newer run of the same event on the same ref replaces an older one; a scheduled run never
# cancels a push run or the other way round.
concurrency:
  group: verify-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows x64
    # The schedule exists for the macOS job alone.
    if: github.event_name != 'schedule'
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          architecture: x64
          cache: gradle

      - name: Build and test
        shell: pwsh
        run: .\gradlew.bat build --console=plain

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-windows-x64
          path: |
            build/reports/tests/
            build/test-results/
          if-no-files-found: ignore

  macos:
    name: macOS Apple Silicon
    # A hosted macOS runner is slower and scarcer, so it checks what is about to reach main, a
    # weekly schedule and manual runs rather than every push.
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.base_ref == 'main')
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          architecture: aarch64
          cache: gradle

      - name: Build and test
        shell: bash
        run: ./gradlew build --console=plain

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-macos-arm64
          path: |
            build/reports/tests/
            build/test-results/
          if-no-files-found: ignore
